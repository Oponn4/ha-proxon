name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      # Die Testsuite läuft bewusst ohne Home-Assistant-Installation: getestet
      # werden die HA-freien Logikmodule (custom_components/proxon/optimistic.py).
      - name: Run tests
        run: python -m pytest tests/ -q

  card:
    name: Schema-Karte
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Unit tests
        run: node --experimental-strip-types --test test/fan.test.ts

      # Das ausgelieferte Bundle liegt im Repo. Weicht es vom Quellstand ab,
      # läuft auf Prod etwas anderes als im Review.
      - name: Bundle matches source
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/proxon/www/proxon-schema-card.js
