name: HA Beta Compatibility

# Frühwarnsystem: installiert die Manifest-Requirements zusammen mit der
# aktuellen HA-Beta (und Stable als Referenz). Ein Resolver-Konflikt wie
# pymodbus==3.11.2 vs. HA-Core-Pin (2026-07-06) wird so eine Woche vor dem
# Monatsrelease als rote CI sichtbar — nicht als tote Integration.

on:
  schedule:
    - cron: "0 6 * * 1" # montags 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  beta-compat:
    name: HA ${{ matrix.channel }} — resolve + import
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      # Python-Version NICHT festnageln. Ein Pin altert: HA 2026.9 verlangt
      # 3.14, mit dem alten 3.13-Pin fiel der Resolver stillschweigend auf
      # 2026.2.3 zurück und der Job prüfte eine Version ohne `async_get_unit`.
      # Stattdessen fragen wir HA selbst, welches Python es braucht.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Von HA gefordertes Python ermitteln
        id: pyver
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, urllib.request
          daten = json.load(urllib.request.urlopen(
              "https://pypi.org/pypi/homeassistant/json", timeout=30))
          # requires_python sieht aus wie ">=3.14.0" — die Untergrenze reicht uns.
          spec = daten["info"].get("requires_python") or ""
          treffer = re.search(r"(\d+)\.(\d+)", spec)
          version = f"{treffer.group(1)}.{treffer.group(2)}" if treffer else "3.x"
          print(f"python={version}")
          print(f"ha_latest={daten['info']['version']}")
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ steps.pyver.outputs.python }}"

      - name: Extract manifest requirements
        run: |
          python -c "
          import json
          reqs = json.load(open('custom_components/proxon/manifest.json'))['requirements']
          open('requirements-manifest.txt', 'w').write('\n'.join(reqs) + '\n')
          "
          cat requirements-manifest.txt

      - name: Install HA (${{ matrix.channel }}) + manifest requirements
        run: |
          pip install --quiet uv
          PRE=""
          if [ "${{ matrix.channel }}" = "beta" ]; then
            PRE="--prerelease=allow"
          fi
          # `packaging` explizit: der Versionsvergleich unten soll nicht davon
          # abhängen, dass HA es zufällig mitzieht.
          uv pip install --system $PRE homeassistant packaging -r requirements-manifest.txt

      # Der Kern der Absicherung: nicht hoffen, dass die richtige Version kam,
      # sondern es behaupten. Fällt der Resolver je wieder zurück — zu altes
      # Python, ein Pin, ein Konflikt — bricht der Job hier mit Klartext,
      # statt grün gegen eine Uraltversion zu laufen.
      - name: Aufgelöste HA-Version absichern
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_LATEST: ${{ steps.pyver.outputs.ha_latest }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from packaging.version import Version
          from homeassistant.const import __version__ as aufgeloest

          minimum = json.load(open("hacs.json"))["homeassistant"]
          neueste = os.environ["HA_LATEST"]
          kanal = os.environ["CHANNEL"]
          print(f"aufgelöst={aufgeloest}  hacs.json-Minimum={minimum}  neueste stabile={neueste}")

          fehler = []
          if Version(aufgeloest) < Version(minimum):
              fehler.append(
                  f"getestet wird HA {aufgeloest}, hacs.json verlangt aber mindestens "
                  f"{minimum} — der Job prüft eine Version, die Nutzer nie bekommen"
              )
          if kanal == "stable" and Version(aufgeloest) < Version(neueste):
              fehler.append(
                  f"stable hätte {neueste} sein müssen, aufgelöst wurde {aufgeloest} — "
                  f"der Resolver ist zurückgefallen (meist eine zu alte Python-Version)"
              )
          if fehler:
              print("FEHLER:")
              for f in fehler:
                  print("  -", f)
              sys.exit(1)
          print("Zielversion bestätigt")
          EOF

      # Wir importieren `homeassistant.components.modbus`; dessen eigene
      # Requirements installiert HA sonst erst zur Laufzeit, ein blankes
      # `pip install homeassistant` bringt sie nicht mit. Aus dem Manifest der
      # Komponente lesen statt hier zu pflegen — sie wandern mit den Releases.
      - name: Install modbus component requirements
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys
          import homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components" / "modbus" / "manifest.json"
          reqs = json.loads(manifest.read_text()).get("requirements", [])
          print("modbus benötigt:", reqs)
          if reqs:
              subprocess.check_call(["uv", "pip", "install", "--system", *reqs])
          EOF

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'EOF'
          from homeassistant.const import __version__
          print(f"Home Assistant {__version__}")
          # Der Import zieht `homeassistant.components.modbus` (async_get_unit)
          # und die Gerätebibliothek proxon-modbus. Verschwindet eine der
          # beiden Schnittstellen in einer neuen Fassung, failt der Job hier —
          # eine Woche vor dem Monatsrelease statt als tote Integration.
          import custom_components.proxon
          import custom_components.proxon.coordinator
          import custom_components.proxon.config_flow
          from homeassistant.components.modbus import async_get_unit, async_get_temporary_unit
          print("proxon imports OK")
          EOF
